<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>فهرست راهنماهای سبک زندگی</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet"/>
<style>
body{margin:0;padding:28px 16px 80px;background:#0a0e14;color:#eef4fa;font:18px/1.85 Vazirmatn,Tahoma,sans-serif}
h1{color:#7dd3c7;font-size:1.35rem;margin:0 0 8px}
.sub{color:#9bb0c3;margin:0 0 18px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 18px}
button,select{font:600 14px Vazirmatn,sans-serif;background:#0d1117;color:#eef4fa;border:1px solid #334155;border-radius:10px;padding:8px 12px;min-height:40px}
.card{display:block;background:#151b24;border:1px solid #334155;border-radius:14px;padding:14px 16px;margin:10px 0;color:inherit;text-decoration:none}
.card:hover{border-color:#7dd3c7}
.card h2{margin:0 0 6px;font-size:1.05rem;color:#7dd3c7}
.meta{color:#9bb0c3;font-size:.92rem}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;font-size:.9rem}
.pill{background:#0d1117;border:1px solid #334155;border-radius:999px;padding:2px 10px}
.pill.ok{border-color:#86e0a3;color:#86e0a3}
.pill.warn{border-color:#f0c14b;color:#f0c14b}
.local{opacity:.85}
footer{color:#9bb0c3;font-size:.85rem;margin-top:28px}
code{direction:ltr;display:inline-block}
</style>
</head>
<body>
<h1>فهرست راهنماها</h1>
<p class="sub">لیست را جور کن. پیشرفت هر کارگاه روی همین مرورگر ذخیره می‌شود. فنی‌ها فقط محلی‌اند و پوش نمی‌شوند.</p>
<div class="bar">
  <label>چینش
    <select id="sort">
      <option value="updated">تازه‌ترین</option>
      <option value="unread">نخوانده اول</option>
      <option value="progress">بیشترین صفحه خوانده</option>
      <option value="title">نام</option>
    </select>
  </label>
  <button type="button" id="btnExport">دانلود وضعیت txt</button>
</div>
<div id="list"></div>
<footer>
این صفحه سبک زندگی را می‌شود به گیت‌هاب فرستاد. فایل فنی و مدارک پزشکی را نفرست.
</footer>
<script>
const GUIDES = [
  {
    id: "personal-os-recomp-v1",
    title: "سیستم‌عامل شخصی — بازترکیب و روتین",
    href: "workshop-personal-os.html",
    pages: 44,
    updated: "2026-10-14",
    kind: "life",
    blurb: "چهار به چهار، روتین ساعت‌به‌ساعت، خرید، آرایش، ترند، عکس‌ها"
  },
  {
    id: "tech-local-vpn-usb-v1",
    title: "فنی محلی — وی‌پی‌ان و کابل شبکه",
    href: "workshop-tech-local.html",
    pages: 44,
    updated: "2026-10-14",
    kind: "local",
    blurb: "اتصال داخلی ویندوز و مبدل یو‌اس‌بی؛ پوش نشود"
  }
];

function readState(key) {
  try {
    const s = JSON.parse(localStorage.getItem(key) || "{}");
    const done = s.done || {};
    let n = 0;
    Object.keys(done).forEach((k) => { if (done[k]) n++; });
    return {
      done: n,
      page: (s.page || 0) + 1,
      hasNotes: !!(s.notes && Object.keys(s.notes).some((k) => s.notes[k]))
    };
  } catch (e) {
    return { done: 0, page: 1, hasNotes: false };
  }
}

function paint() {
  const sort = document.getElementById("sort").value;
  const rows = GUIDES.map((g) => {
    const st = readState(g.id);
    return Object.assign({}, g, st, { ratio: st.done / g.pages });
  });
  rows.sort((a, b) => {
    if (sort === "updated") return b.updated.localeCompare(a.updated);
    if (sort === "unread") return a.ratio - b.ratio;
    if (sort === "progress") return b.done - a.done;
    return a.title.localeCompare(b.title, "fa");
  });
  const box = document.getElementById("list");
  box.innerHTML = rows.map((g) => {
    const unread = g.done === 0;
    const pill = unread ? "pill warn" : "pill ok";
    const status = unread ? "نخوانده" : (g.done >= g.pages ? "تمام" : "نیمه‌کاره");
    const local = g.kind === "local" ? " local" : "";
    return '<a class="card' + local + '" href="' + g.href + '"><h2>' + g.title + '</h2><p class="meta">' + g.blurb + '</p><div class="row">' +
      '<span class="' + pill + '">' + status + '</span>' +
      '<span class="pill">خوانده ' + g.done + ' از ' + g.pages + '</span>' +
      '<span class="pill">آخرین صفحه ' + g.page + '</span>' +
      '<span class="pill">به‌روز ' + g.updated + '</span>' +
      (g.hasNotes ? '<span class="pill">یادداشت دارد</span>' : "") +
      (g.kind === "local" ? '<span class="pill">فقط همین رایانه</span>' : "") +
      "</div></a>";
  }).join("");
}

document.getElementById("sort").onchange = paint;
document.getElementById("btnExport").onclick = () => {
  let out = "lifestyle guides status\n" + new Date().toISOString() + "\n\n";
  GUIDES.forEach((g) => {
    const st = readState(g.id);
    out += g.title + " — " + st.done + "/" + g.pages + " — page " + st.page + "\n";
  });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([out], { type: "text/plain;charset=utf-8" }));
  a.download = "lifestyle-guides-status.txt";
  a.click();
};
paint();
</script>
</body>
</html>
